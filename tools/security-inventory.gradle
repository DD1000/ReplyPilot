import groovy.json.JsonOutput

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('securityInventory') {
        doLast {
            def rows = app.configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
                def module = it.moduleVersion.id
                [name: "${module.group}:${module.name}", version: module.version]
            }.unique().sort { a,b -> a.name <=> b.name }
            def target = new File(app.rootDir, 'security-audit/runtime-components.json')
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(rows)) + '\n'
            println "Recorded ${rows.size()} resolved runtime artifacts."
        }
    }
}
